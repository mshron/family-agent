# Forward proxy for exec-container browsing (vault box). All session
# internet egress flows through here: one hop, one log, one future
# filtering/scanning point. No caching — pages must be fresh.
http_port 3128

# Deny caching entirely (correctness over speed for agent work); squid
# then uses memory only for in-flight state, with no cache_dir on disk.
cache deny all
maximum_object_size 0 bytes

# Allow everything from the compose networks; the vault firewall and the
# session box's egress lockdown are the access controls, not squid.
http_access allow all

# The audit trail: one line per request to the container log (vault).
access_log stdio:squid-access.log
